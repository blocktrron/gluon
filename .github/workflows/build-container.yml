# Based on the example from https://docs.github.com/en/actions/publishing-packages/publishing-docker-images
name: Create and publish a Docker image

on:
  push:
    branches:
    tags:
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-build

jobs:
  gluon-build:
    runs-on: ubuntu-26.04
    permissions: write-all
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: ${{ github.event_name == 'push' }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=long
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./contrib/docker/gluon-build
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Build Docker image for artifact
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./contrib/docker/gluon-build
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          outputs: type=docker,dest=/tmp/gluon-build.tar
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: gluon-build-container
          path: /tmp/gluon-build.tar
          retention-days: 1

  gluon-targets:
    outputs:
      targets: ${{ steps.get-targets.outputs.targets }}
    runs-on: ubuntu-26.04
    name: Get Gluon targets
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Get Targets
        uses: freifunk-gluon/action-target-list@v1
        id: get-targets
        with:
          gluon-path: "."
          broken: true
  
  gluon-target-container:
    env:
      TARGET_IMAGE_NAME: ${{ github.repository }}-target-build
    needs:
      - gluon-build
      - gluon-targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.gluon-targets.outputs.targets) }}

    runs-on: ubuntu-26.04
    permissions: write-all
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download Gluon build image artifact
        uses: actions/download-artifact@v7
        with:
          name: gluon-build-container
          path: /tmp/gluon-build
      - name: Load Gluon build image
        run: docker load --input /tmp/gluon-build/gluon-build.tar
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: ${{ github.event_name == 'push' }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: blocktrron/gluon-target
          tags: |
            type=raw,value=${{ matrix.target }}-${{ github.sha }}
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./contrib/docker/gluon-target
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64
          build-args: |
            GLUON_BUILD_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            GLUON_COMMIT=${{ github.sha }}
            GLUON_TARGET=${{ matrix.target }}
            GLUON_REPO=https://github.com/blocktrron/gluon.git
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}